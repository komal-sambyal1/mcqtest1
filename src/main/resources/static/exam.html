<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MCQ Examination</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="exam-header">

    <div class="exam-header-left">

        <h2>Online MCQ Examination</h2>

        <p>
            Candidate:
            <span id="candidateName"></span>
        </p>

    </div>


    <div class="exam-header-right">

        

        <div class="timer">

            Time Left:
            <span id="timer">40:00</span>

        </div>

    </div>

</header>


<div class="exam-layout">

    <main class="question-section">

        <div id="questionContainer">

            Loading questions...

        </div>


        <div class="navigation-buttons">

            <button
                type="button"
                id="previousButton"
            >
                Previous
            </button>


            <button
                type="button"
                id="nextButton"
            >
                Next
            </button>

        </div>


        <button
            type="button"
            id="submitExam"
            class="submit-button"
        >
            Submit Examination
        </button>

    </main>


    <aside class="sidebar">

        <h3>Questions</h3>

        <div id="questionNumbers"></div>


        

    </aside>

</div>


<script src="exam.js"></script>

</body>

</html>
