<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Examination Result</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card result-card">

            <h1>Examination Submitted Successfully</h1>

            <p>Thank you for completing the examination.</p>

            <div class="result-details">

                <p>
                    <strong>Candidate Name:</strong>
                    <span id="candidateName"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="candidateEmail"></span>
                </p>

                <hr>

                <p>
                    <strong>Total Questions:</strong>
                    <span id="totalQuestions"></span>
                </p>

                <p>
                    <strong>Attempted:</strong>
                    <span id="attempted"></span>
                </p>

                <p>
                    <strong>Unanswered:</strong>
                    <span id="unanswered"></span>
                </p>

                <p>
                    <strong>Correct Answers:</strong>
                    <span id="correctAnswers"></span>
                </p>

                <p>
                    <strong>Wrong Answers:</strong>
                    <span id="wrongAnswers"></span>
                </p>

                <h2>
                    Score:
                    <span id="score"></span>
                </h2>

            </div>

        </div>

    </div>

    <script src="result.js"></script>

</body>

</html>
